name: Live smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

jobs:
  live-smoke:
    name: live-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build CLI
        run: go build -o flightclaw ./cmd/flightclaw
      - name: Search live route
        shell: bash
        run: |
          set -euo pipefail
          travel_date="$(date -u -d '+120 days' +%F)"
          timeout 90s ./flightclaw \
            --from LHR \
            --to JFK \
            --date "${travel_date}" \
            --results 3 \
            --timeout 75s \
            --json > smoke.json
      - name: Validate live response
        run: |
          jq -e '
            (.query.from == "LHR") and
            (.query.to == "JFK") and
            (.results | length >= 1) and
            all(.results[];
              (.total_price | type == "number") and
              (.currency | type == "string" and length > 0) and
              (.outbound.date | type == "string" and length > 0) and
              (.outbound.price | type == "number") and
              (.outbound.currency | type == "string" and length > 0) and
              (.outbound.duration_minutes | type == "number") and
              (.outbound.segments | length >= 1) and
              all(.outbound.segments[];
                (.airline | type == "string" and length > 0) and
                (.flight_number | type == "string" and length > 0) and
                (.departure_airport | type == "string" and length > 0) and
                (.arrival_airport | type == "string" and length > 0) and
                (.departure_time | type == "string" and length > 0) and
                (.arrival_time | type == "string" and length > 0)
              )
            )
          ' smoke.json
